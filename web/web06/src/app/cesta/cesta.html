<div class="container my-5">
  <h2 class="mb-4 text-primary">🛒 Cesta de Compras</h2>

  <div class="card shadow-sm">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table align-middle table-hover">
          <thead class="table-dark">
            <tr>
              <th>Produto</th>
              <th>Preço Unitário</th>
              <th>Quantidade</th>
              <th>Subtotal</th>
            </tr>
          </thead>
          <tbody>
            <!-- Uso obrigatório do *ngFor -->
            <tr *ngFor="let item of itensCesta">
              <td>{{ item.produto.nome }}</td>
              <td>{{ item.produto.valor | currency:'BRL' }}</td>
              <td><span class="badge bg-secondary">{{ item.quantidade }}</span></td>
              <td>{{ (item.produto.valor * item.quantidade) | currency:'BRL' }}</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="d-flex justify-content-between align-items-center mt-4">
        <h4>Total: <span class="text-success">{{ calcularTotal() | currency:'BRL' }}</span></h4>
      </div>
    </div>
  </div>
</div>
