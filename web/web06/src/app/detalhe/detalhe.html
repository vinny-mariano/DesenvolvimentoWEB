<div class="container my-5">
  <div class="card shadow-sm">
    <div class="card-body">
      <h2 class="card-title text-primary">{{ produto.nome }}</h2>
      <p class="text-muted">{{ produto.descritivo }}</p>
      <hr>
      <p class="h4 text-success">Preço: {{ produto.valor | currency:'BRL' }}</p>
      <p>Estoque: <span class="badge bg-info">{{ produto.quantidade }} unidades</span></p>
      <button class="btn btn-primary mt-3">Adicionar à Cesta</button>
    </div>
  </div>
</div>
